name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - run: cargo +nightly fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install GPUI system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-xcb-dev libxcb1-dev libvulkan-dev libfontconfig-dev libfreetype-dev \
            libasound2-dev libssl-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shop_dev
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 30
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-retries 30
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: mysql
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pmysql" --health-interval 2s --health-retries 60
      clickhouse:
        image: clickhouse/clickhouse-server:24.8
        env:
          CLICKHOUSE_USER: default
          CLICKHOUSE_PASSWORD: clickhouse
        ports: ["8123:8123"]
        options: >-
          --health-cmd "wget -qO- http://127.0.0.1:8123/ping" --health-interval 2s --health-retries 60
      foundationdb:
        image: foundationdb/foundationdb:7.3.69
        env:
          FDB_NETWORKING_MODE: host
          FDB_PORT: "4500"
        ports: ["4500:4500"]
    env:
      RIFT_REQUIRE_DOCKER: "1"
      # GPUI debug info fills the runner's disk; tests don't need it.
      CARGO_PROFILE_DEV_DEBUG: "0"
      RIFT_FDB_CLUSTER: docker:docker@127.0.0.1:4500
      RIFT_REQUIRE_TOOLS: "1"
      RIFT_SSH_PORT: "2222"
      RIFT_SSH_TARGET: 127.0.0.1:5432
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v4
      - name: Install GPUI system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-xcb-dev libxcb1-dev libvulkan-dev libfontconfig-dev libfreetype-dev \
            libasound2-dev libssl-dev pkg-config
      - name: Start an SSH bastion for the tunnel test
        run: |
          mkdir -p dev/ssh/keys && ssh-keygen -q -t ed25519 -N '' -f dev/ssh/keys/id_ed25519
          docker build -q -t rift-ssh dev/ssh
          docker run -d --network host -v "$PWD/dev/ssh/keys/id_ed25519.pub:/keys/authorized_keys:ro" rift-ssh
      - name: Install pg_dump and mysqldump for the backup suites
        run: sudo apt-get install -y postgresql-client mysql-client
      - name: Install the FoundationDB client and create the database
        run: |
          curl -fsSL -o /tmp/fdb.deb https://github.com/apple/foundationdb/releases/download/7.3.69/foundationdb-clients_7.3.69-1_amd64.deb
          sudo dpkg -i /tmp/fdb.deb
          echo "$RIFT_FDB_CLUSTER" > /tmp/fdb.cluster
          fdbcli -C /tmp/fdb.cluster --exec "configure new single memory" --timeout 60
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - run: cargo test -p registry --features fake

  deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install GPUI system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-xcb-dev libxcb1-dev libvulkan-dev libfontconfig-dev libfreetype-dev \
            libasound2-dev libssl-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - run: scripts/check-deps.sh
