<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<body>


<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&amp;display=swap">
<style>
body{margin:0;background:#ffffff}

</style>

<div style="width: 100%; height: 900px; display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box; background-color: #ffffff; background-image: radial-gradient(#dedbd7 1px, transparent 1px); background-size: 22px 22px; font-family: 'Source Serif 4', Charter, 'Bitstream Charter', Georgia, serif; color: #1c1917; font-size: 13px">
<section role="dialog" aria-modal="true" aria-labelledby="n3-title" style="width: 100%; max-width: 520px; display: flex; flex-direction: column; background: #ffffff; border: 1px solid #e7e5e4; border-radius: 6px; box-shadow: 0 24px 64px rgba(16,24,40,0.18)">
<header style="display: flex; align-items: center; padding: 16px 20px 0"><h1 id="n3-title" style="margin: 0; font-size: 15px; font-weight: 600">New connection</h1><span style="margin-left: auto"><button type="button" aria-label="Close dialog" style="display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 6px; background: transparent; color: #57534e; border: 1px solid transparent; cursor: pointer"><svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></span></header>
<div style="display: flex; flex-direction: column; gap: 14px; padding: 16px 20px">
<div style="display: flex; gap: 12px"><div style="display: flex; flex-direction: column; gap: 6px; min-width: 0; flex: 1 1 0"><label for="n3-type" style="font-size: 12.5px; font-weight: 500; color: #57534e">Type</label><select id="n3-type" style="height: 34px; width: 100%; padding: 0 8px; border-radius: 4px; background: #ffffff; border: 1px solid #e7e5e4; color: #1c1917; font-size: 13px"><option>PostgreSQL</option></select></div><div style="display: flex; flex-direction: column; gap: 6px; min-width: 0; flex: 1 1 0"><label for="n3-name" style="font-size: 12.5px; font-weight: 500; color: #57534e">Name</label><input id="n3-name" type="text" value="local-dev" style="height: 34px; width: 100%; box-sizing: border-box; padding: 0 10px; border-radius: 4px; background: #ffffff; border: 1px solid #e7e5e4; color: #1c1917; font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; font-size: 13px"></div></div>
<div style="display: flex; gap: 12px"><div style="display: flex; flex-direction: column; gap: 6px; min-width: 0; flex: 1 1 0"><label for="n3-host" style="font-size: 12.5px; font-weight: 500; color: #57534e">Host</label><input id="n3-host" type="text" value="127.0.0.1" style="height: 34px; width: 100%; box-sizing: border-box; padding: 0 10px; border-radius: 4px; background: #ffffff; border: 1px solid #e7e5e4; color: #1c1917; font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; font-size: 13px"></div><div style="flex: 0 0 96px"><div style="display: flex; flex-direction: column; gap: 6px; min-width: 0; flex: 1 1 0"><label for="n3-port" style="font-size: 12.5px; font-weight: 500; color: #57534e">Port</label><input id="n3-port" type="text" value="5432" style="height: 34px; width: 100%; box-sizing: border-box; padding: 0 10px; border-radius: 4px; background: #ffffff; border: 1px solid #e7e5e4; color: #1c1917; font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; font-size: 13px"></div></div></div>
<div style="display: flex; gap: 12px"><div style="display: flex; flex-direction: column; gap: 6px; min-width: 0; flex: 1 1 0"><label for="n3-user" style="font-size: 12.5px; font-weight: 500; color: #57534e">User</label><input id="n3-user" type="text" value="postgres" style="height: 34px; width: 100%; box-sizing: border-box; padding: 0 10px; border-radius: 4px; background: #ffffff; border: 1px solid #e7e5e4; color: #1c1917; font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; font-size: 13px"></div><div style="display: flex; flex-direction: column; gap: 6px; min-width: 0; flex: 1 1 0"><label for="n3-pass" style="font-size: 12.5px; font-weight: 500; color: #57534e">Password</label><input id="n3-pass" type="password" value="secretpass" style="height: 34px; width: 100%; box-sizing: border-box; padding: 0 10px; border-radius: 4px; background: #ffffff; border: 1px solid #e7e5e4; color: #1c1917; font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; font-size: 13px"></div></div>
<div style="display: flex; gap: 12px"><div style="display: flex; flex-direction: column; gap: 6px; min-width: 0; flex: 1 1 0"><label for="n3-db" style="font-size: 12.5px; font-weight: 500; color: #57534e">Database</label><input id="n3-db" type="text" value="shop_dev" style="height: 34px; width: 100%; box-sizing: border-box; padding: 0 10px; border-radius: 4px; background: #ffffff; border: 1px solid #e7e5e4; color: #1c1917; font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; font-size: 13px"></div><div style="display: flex; flex-direction: column; gap: 6px; min-width: 0; flex: 1 1 0"><label for="n3-grp" style="font-size: 12.5px; font-weight: 500; color: #57534e">Group</label><select id="n3-grp" style="height: 34px; width: 100%; padding: 0 8px; border-radius: 4px; background: #ffffff; border: 1px solid #e7e5e4; color: #1c1917; font-size: 13px"><option>Local</option></select></div></div>
<div style="display: flex; flex-direction: column; gap: 8px"><span style="font-size: 12.5px; font-weight: 500; color: #57534e">Tag</span><div role="radiogroup" aria-label="Color tag" style="display: flex; gap: 10px"><label style="display: inline-flex; cursor: pointer"><input type="radio" name="tag3" checked aria-label="Green" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)"><span aria-hidden="true" style="width: 20px; height: 20px; border-radius: 3px; background: #7bb08a; box-shadow: 0 0 0 2px #ffffff, 0 0 0 3.5px #57534e;"></span></label><label style="display: inline-flex; cursor: pointer"><input type="radio" name="tag3"  aria-label="Teal" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)"><span aria-hidden="true" style="width: 20px; height: 20px; border-radius: 3px; background: #72aeb3; "></span></label><label style="display: inline-flex; cursor: pointer"><input type="radio" name="tag3"  aria-label="Blue" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)"><span aria-hidden="true" style="width: 20px; height: 20px; border-radius: 3px; background: #88a6dc; "></span></label><label style="display: inline-flex; cursor: pointer"><input type="radio" name="tag3"  aria-label="Purple" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)"><span aria-hidden="true" style="width: 20px; height: 20px; border-radius: 3px; background: #a597d8; "></span></label><label style="display: inline-flex; cursor: pointer"><input type="radio" name="tag3"  aria-label="Orange" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)"><span aria-hidden="true" style="width: 20px; height: 20px; border-radius: 3px; background: #d6a06a; "></span></label><label style="display: inline-flex; cursor: pointer"><input type="radio" name="tag3"  aria-label="Red" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)"><span aria-hidden="true" style="width: 20px; height: 20px; border-radius: 3px; background: #d98a85; "></span></label></div></div>
<button type="button" aria-expanded="false" style="display: inline-flex; align-items: center; gap: 6px; align-self: flex-start; padding: 0; border: 0; background: transparent; color: #57534e; font-size: 12.5px; cursor: pointer"><svg aria-hidden="true" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><path d="M9 6l6 6-6 6"></path></svg>More options (SSH, TLS, read-only)</button>
</div>
<footer style="display: flex; align-items: center; gap: 8px; padding: 14px 20px; border-top: 1px solid #e7e5e4">
<button type="button" style="display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 14px; border-radius: 6px; font-size: 13px; font-weight: 500; cursor: pointer; white-space: nowrap; background: #f5f5f4; color: #1c1917; border: 1px solid #e7e5e4;"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><path d="M5 12l5 5 9-10"></path></svg>Test</button><span style="font-size: 12px; color: #1a7f37; display: inline-flex; align-items: center; gap: 4px"><svg aria-hidden="true" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><path d="M5 12l5 5 9-10"></path></svg>OK · 38 ms</span>
<span style="margin-left: auto"></span>
