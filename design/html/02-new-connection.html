<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New connection</title>

</head>
<body>


<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#ffffff;-webkit-font-smoothing:antialiased}
td{font-variant-numeric:tabular-nums}
a{color:#c2453d}a:hover{color:#9b2f28}

</style>

<div style="width: 100%; height: 900px; display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box; background-color: #ffffff; background-image: radial-gradient(#e4e4e7 1px, transparent 1px); background-size: 22px 22px; font-family: Inter, system-ui, -apple-system, 'Segoe UI', sans-serif; color: #18181b; font-size: 13px">
<section role="dialog" aria-modal="true" aria-labelledby="n3-title" style="width: 100%; max-width: 520px; display: flex; flex-direction: column; background: #ffffff; border: 1px solid #e4e4e7; border-radius: 10px; box-shadow: 0 24px 64px rgba(16,24,40,0.18)">
<header style="display: flex; align-items: center; padding: 16px 20px 0"><h1 id="n3-title" style="margin: 0; font-size: 15px; font-weight: 600">New connection</h1><span style="margin-left: auto"><button type="button" aria-label="Close dialog" style="display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 10px; background: transparent; color: #52525b; border: 1px solid transparent; cursor: pointer"><svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></span></header>
<div style="display: flex; flex-direction: column; gap: 18px; padding: 20px 24px">
<div style="display: flex; gap: 12px"><div style="display: flex; flex-direction: column; gap: 6px; min-width: 0; flex: 1 1 0"><label for="n3-type" style="font-size: 12.5px; font-weight: 500; color: #52525b">Type</label><select id="n3-type" style="height: 34px; width: 100%; padding: 0 8px; border-radius: 8px; background: #ffffff; border: 1px solid #e4e4e7; color: #18181b; font-size: 13px"><option>PostgreSQL</option></select></div><div style="display: flex; flex-direction: column; gap: 6px; min-width: 0; flex: 1 1 0"><label for="n3-name" style="font-size: 12.5px; font-weight: 500; color: #52525b">Name</label><input id="n3-name" type="text" value="local-dev" style="height: 34px; width: 100%; box-sizing: border-box; padding: 0 10px; border-radius: 8px; background: #ffffff; border: 1px solid #e4e4e7; color: #18181b; font-family: Inter, system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: 13px"></div></div>
<div style="display: flex; gap: 12px"><div style="display: flex; flex-direction: column; gap: 6px; min-width: 0; flex: 1 1 0"><label for="n3-host" style="font-size: 12.5px; font-weight: 500; color: #52525b">Host</label><input id="n3-host" type="text" value="127.0.0.1" style="height: 34px; width: 100%; box-sizing: border-box; padding: 0 10px; border-radius: 8px; background: #ffffff; border: 1px solid #e4e4e7; color: #18181b; font-family: Inter, system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: 13px"></div><div style="flex: 0 0 96px"><div style="display: flex; flex-direction: column; gap: 6px; min-width: 0; flex: 1 1 0"><label for="n3-port" style="font-size: 12.5px; font-weight: 500; color: #52525b">Port</label><input id="n3-port" type="text" value="5432" style="height: 34px; width: 100%; box-sizing: border-box; padding: 0 10px; border-radius: 8px; background: #ffffff; border: 1px solid #e4e4e7; color: #18181b; font-family: Inter, system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: 13px"></div></div></div>
<div style="display: flex; gap: 12px"><div style="display: flex; flex-direction: column; gap: 6px; min-width: 0; flex: 1 1 0"><label for="n3-user" style="font-size: 12.5px; font-weight: 500; color: #52525b">User</label><input id="n3-user" type="text" value="postgres" style="height: 34px; width: 100%; box-sizing: border-box; padding: 0 10px; border-radius: 8px; background: #ffffff; border: 1px solid #e4e4e7; color: #18181b; font-family: Inter, system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: 13px"></div><div style="display: flex; flex-direction: column; gap: 6px; min-width: 0; flex: 1 1 0"><label for="n3-pass" style="font-size: 12.5px; font-weight: 500; color: #52525b">Password</label><input id="n3-pass" type="password" value="secretpass" style="height: 34px; width: 100%; box-sizing: border-box; padding: 0 10px; border-radius: 8px; background: #ffffff; border: 1px solid #e4e4e7; color: #18181b; font-family: Inter, system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: 13px"></div></div>
<div style="display: flex; gap: 12px"><div style="display: flex; flex-direction: column; gap: 6px; min-width: 0; flex: 1 1 0"><label for="n3-db" style="font-size: 12.5px; font-weight: 500; color: #52525b">Database</label><input id="n3-db" type="text" value="shop_dev" style="height: 34px; width: 100%; box-sizing: border-box; padding: 0 10px; border-radius: 8px; background: #ffffff; border: 1px solid #e4e4e7; color: #18181b; font-family: Inter, system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: 13px"></div><div style="display: flex; flex-direction: column; gap: 6px; min-width: 0; flex: 1 1 0"><label for="n3-grp" style="font-size: 12.5px; font-weight: 500; color: #52525b">Group</label><select id="n3-grp" style="height: 34px; width: 100%; padding: 0 8px; border-radius: 8px; background: #ffffff; border: 1px solid #e4e4e7; color: #18181b; font-size: 13px"><option>Local</option></select></div></div>
<button type="button" aria-expanded="false" style="display: inline-flex; align-items: center; gap: 6px; align-self: flex-start; padding: 0; border: 0; background: transparent; color: #52525b; font-size: 12.5px; cursor: pointer"><svg aria-hidden="true" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><path d="M9 6l6 6-6 6"></path></svg>More options (SSH, TLS, read-only)</button>
</div>
<footer style="display: flex; align-items: center; gap: 8px; padding: 14px 20px; border-top: 1px solid #e4e4e7">
<button type="button" style="display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 14px; border-radius: 10px; font-size: 13px; font-weight: 500; cursor: pointer; white-space: nowrap; background: #ffffff; color: #18181b; border: 1px solid #e4e4e7; box-shadow: 0 1px 1px rgba(24,24,27,0.04);"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><path d="M5 12l5 5 9-10"></path></svg>Test</button><span style="font-size: 12px; color: #1a7f37; display: inline-flex; align-items: center; gap: 4px"><svg aria-hidden="true" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><path d="M5 12l5 5 9-10"></path></svg>OK · 38 ms</span>
<span style="margin-left: auto"></span>
<a href="01-connections.html" style="display: inline-flex; align-items: center; height: 32px; padding: 0 12px; color: #52525b; font-size: 13px; font-weight: 500; text-decoration: none">Cancel</a>

</footer></section></div>
