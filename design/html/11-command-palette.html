<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Command palette</title>

</head>
<body>


<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&amp;display=swap">
<style>
body{margin:0;background:#ffffff}
a{color:#c2453d}a:hover{color:#9b2f28}
button,input,select{font:inherit}
</style>

<div style="width: 100%; height: 900px; display: flex; justify-content: center; align-items: flex-start; padding: 120px 24px 24px; box-sizing: border-box; background-color: #ffffff; background-image: radial-gradient(#dedbd7 1px, transparent 1px); background-size: 22px 22px; font-family: 'Source Serif 4', Charter, 'Bitstream Charter', Georgia, serif; color: #1c1917">
<section role="dialog" aria-modal="true" aria-label="Open anything" style="width: 100%; max-width: 620px; background: #ffffff; border: 1px solid #e7e5e4; border-radius: 12px; box-shadow: 0 24px 64px rgba(16,24,40,0.18); overflow: hidden">
<div style="display: flex; align-items: center; gap: 10px; padding: 0 16px; height: 52px; border-bottom: 1px solid #e7e5e4">
<span style="display: flex; color: #6f6a65"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg></span>
<label for="cp-q" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search tables, queries, connections</label>
<input id="cp-q" value="order" style="flex: 1; height: 50px; background: transparent; border: 0; color: #1c1917; font-size: 16px; outline: none">
<kbd style="font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; font-size: 11px; color: #57534e; padding: 2px 6px; border: 1px solid #e7e5e4; border-radius: 4px">esc</kbd>
</div>
<ul role="listbox" aria-label="Results" style="list-style: none; margin: 0; padding: 6px; display: flex; flex-direction: column; gap: 2px"><li role="option" aria-selected="true" style="display: flex; align-items: center; gap: 10px; padding: 0 12px; height: 40px; border-radius: 6px; background: #f2f0ed;"><svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#c2453d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M3 10h18M3 15h18M9 4v16"></path></svg><span style="font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; font-size: 13px; color: #1c1917"><b style="font-weight: 600; color: #c2453d">order</b>s</span><span style="margin-left: auto; font-size: 12px; color: #6f6a65">local-dev · public</span></li><li role="option" aria-selected="false" style="display: flex; align-items: center; gap: 10px; padding: 0 12px; height: 40px; border-radius: 6px; background: transparent;"><svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#6f6a65" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M3 10h18M3 15h18M9 4v16"></path></svg><span style="font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; font-size: 13px; color: #1c1917"><b style="font-weight: 600; color: #c2453d">order</b>_items</span><span style="margin-left: auto; font-size: 12px; color: #6f6a65">local-dev · public</span></li><li role="option" aria-selected="false" style="display: flex; align-items: center; gap: 10px; padding: 0 12px; height: 40px; border-radius: 6px; background: transparent;"><svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#6f6a65" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg><span style="font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; font-size: 13px; color: #1c1917"><b style="font-weight: 600; color: #c2453d">order</b>s_daily_summary</span><span style="margin-left: auto; font-size: 12px; color: #6f6a65">local-dev · view</span></li><li role="option" aria-selected="false" style="display: flex; align-items: center; gap: 10px; padding: 0 12px; height: 40px; border-radius: 6px; background: transparent;"><svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#6f6a65" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M3 10h18M3 15h18M9 4v16"></path></svg><span style="font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; font-size: 13px; color: #1c1917"><b style="font-weight: 600; color: #c2453d">order</b>s</span><span style="margin-left: auto; font-size: 12px; color: #6f6a65">staging-shop · shop</span></li><li role="option" aria-selected="false" style="display: flex; align-items: center; gap: 10px; padding: 0 12px; height: 40px; border-radius: 6px; background: transparent;"><svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#6f6a65" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><path d="M8 8l-5 4 5 4M16 8l5 4-5 4"></path></svg><span style="font-family: 'Source Serif 4', Charter, 'Bitstream Charter', Georgia, serif; font-size: 13px; color: #1c1917">Query · top customers by revenue</span><span style="margin-left: auto; font-size: 12px; color: #6f6a65">history · yesterday</span></li><li role="option" aria-selected="false" style="display: flex; align-items: center; gap: 10px; padding: 0 12px; height: 40px; border-radius: 6px; background: transparent;"><svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#6f6a65" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><ellipse cx="12" cy="5" rx="8" ry="3"></ellipse><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"></path></svg><span style="font-family: 'Source Serif 4', Charter, 'Bitstream Charter', Georgia, serif; font-size: 13px; color: #1c1917">Connect to prod-analytics</span><span style="margin-left: auto; font-size: 12px; color: #6f6a65">connection</span></li></ul>
<footer style="display: flex; gap: 16px; padding: 10px 16px; border-top: 1px solid #e7e5e4; font-size: 12px; color: #6f6a65"><span>↑↓ navigate</span><span>↵ open</span><span>⌘↵ open in new tab</span><span style="margin-left: auto">Searches all open connections</span></footer>
</section>
</div>


</body>
</html>
