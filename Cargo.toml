[workspace]
resolver = "3"
members = [
  "crates/types",
  "crates/traits",
  "crates/dialect",
  "crates/registry",
  "crates/conn",
  "crates/store",
  "crates/app",
  "crates/testkit",
  "crates/fdb-ffi",
  "crates/drivers/*",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
types = { path = "crates/types" }
traits = { path = "crates/traits" }
dialect = { path = "crates/dialect" }
registry = { path = "crates/registry" }
conn = { path = "crates/conn" }
store = { path = "crates/store" }
testkit = { path = "crates/testkit" }
postgres-driver = { path = "crates/drivers/postgres" }
mysql-driver = { path = "crates/drivers/mysql" }
sqlite-driver = { path = "crates/drivers/sqlite" }
clickhouse-driver = { path = "crates/drivers/clickhouse" }
redis-driver = { path = "crates/drivers/redis" }
fdb-ffi = { path = "crates/fdb-ffi" }
foundationdb-driver = { path = "crates/drivers/foundationdb" }

anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
csv = "1.4.0"
dirs = "7.0.0"
futures = "0.3.34"
gpui = { package = "gpui-pre", version = "=0.3.12" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.12", features = ["font-kit", "x11", "wayland", "runtime_shaders"] }
gpui-kit-assets = "=0.10.0"
gpui-component = { version = "=0.10.0", features = ["tree-sitter-sql"] }
insta = "1.49.0"
keyring = "4.2.0"
redis = { version = "1.8.2", default-features = false, features = ["tokio-comp", "connection-manager", "streams"] }
refinery = { version = "0.10.0", features = ["rusqlite"] }
russh = "0.65.2"
rusqlite = { version = "0.40.2", features = ["bundled", "backup"] }
libloading = "0.9.1"
reqwest = { version = "0.13.5", default-features = false, features = ["stream", "query"] }
rust_decimal = { version = "1.43.0", features = ["serde-str"] }
sqlparser = { version = "0.64.0", default-features = false, features = ["std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-util = "0.7.20"
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "postgres", "mysql"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.29.3", features = ["v4", "serde"] }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
borrowed_box = "deny"
ptr_arg = "deny"
should_implement_trait = "deny"
new_without_default = "deny"
len_without_is_empty = "deny"
exhaustive_enums = "deny"
wrong_self_convention = "deny"
unwrap_used = "deny"
wildcard_imports = "deny"
enum_glob_use = "deny"
fn_params_excessive_bools = "deny"
string_add = "deny"
needless_for_each = "deny"
must_use_candidate = "warn"
