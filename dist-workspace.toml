[workspace]
members = ["cargo:."]

# Release builds: `dist plan` previews them; pushing a `v*` tag runs .github/workflows/release.yml.
[dist]
cargo-dist-version = "0.34.0"
ci = "github"
installers = ["shell", "powershell", "homebrew"]
# The formula ships as a release artifact. To publish it, create the tap repository, add a
# HOMEBREW_TAP_TOKEN secret, and add: publish-jobs = ["homebrew"]
tap = "projectlighthouse-io/homebrew-tap"
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
]
install-path = "CARGO_HOME"
install-updater = false

[dist.github-custom-runners]
aarch64-unknown-linux-gnu = "ubuntu-24.04-arm"
x86_64-unknown-linux-gnu = "ubuntu-24.04"

# GPUI needs these headers to build on Linux.
[dist.dependencies.apt]
libxkbcommon-dev = "*"
libxkbcommon-x11-dev = "*"
libwayland-dev = "*"
libx11-xcb-dev = "*"
libxcb1-dev = "*"
libvulkan-dev = "*"
libfontconfig-dev = "*"
libfreetype-dev = "*"
libasound2-dev = "*"
libssl-dev = "*"
pkg-config = "*"
