[package]
name = "rift"
description = "Rift: a fast, native database client."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[dependencies]
types = { workspace = true }
traits = { workspace = true }
registry = { workspace = true }
conn = { workspace = true }
store = { workspace = true }
dialect = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
csv = { workspace = true }
resvg = { version = "0.50.0", default-features = false, features = ["text"] }
lsp-types = { version = "0.97.0", features = ["proposed"] }
sqlformat = "0.5.0"
dirs = { workspace = true }
futures = { workspace = true }
serde_json = { workspace = true }
gpui = { workspace = true }
gpui-component = { workspace = true }
gpui_platform = { workspace = true }
gpui-kit-assets = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
[[bin]]
name = "rift"
path = "src/main.rs"

[dev-dependencies]
testkit = { workspace = true }

# `cargo dist` ships the app even though crates are not published to crates.io.
[package.metadata.dist]
dist = true
