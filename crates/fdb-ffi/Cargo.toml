[package]
name = "fdb-ffi"
description = "FoundationDB C client, loaded at runtime. The only crate with unsafe code."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# The workspace lints with `unsafe_code` relaxed from forbid to deny, so `ffi.rs` alone can
# allow it. Keep in sync with `[workspace.lints]`.
[lints.rust]
missing_docs = "warn"
unsafe_code = "deny"

[lints.clippy]
borrowed_box = "deny"
ptr_arg = "deny"
should_implement_trait = "deny"
new_without_default = "deny"
len_without_is_empty = "deny"
exhaustive_enums = "deny"
wrong_self_convention = "deny"
unwrap_used = "deny"
wildcard_imports = "deny"
enum_glob_use = "deny"
fn_params_excessive_bools = "deny"
string_add = "deny"
needless_for_each = "deny"
must_use_candidate = "warn"

[dependencies]
libloading = { workspace = true }
