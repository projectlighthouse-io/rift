name: rift-dev

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: shop_dev
    ports:
      - "${RIFT_PG_PORT:-5432}:5432"
    volumes:
      - ./dev/seed:/seed:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "shop_dev"]
      interval: 2s
      timeout: 2s
      retries: 30

  redis:
    image: redis:7
    ports:
      - "${RIFT_REDIS_PORT:-6379}:6379"
    volumes:
      - ./dev/seed:/seed:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: mysql
      MYSQL_DATABASE: shop
    ports:
      - "${RIFT_MYSQL_PORT:-3306}:3306"
    volumes:
      - ./dev/seed:/seed:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-pmysql"]
      interval: 2s
      timeout: 2s
      retries: 60

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: clickhouse
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "${RIFT_CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "${RIFT_CLICKHOUSE_PORT:-9000}:9000"
    volumes:
      - ./dev/seed:/seed:ro
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8123/ping"]
      interval: 2s
      timeout: 2s
      retries: 60

  foundationdb:
    image: foundationdb/foundationdb:7.3.69
    environment:
      # Advertise 127.0.0.1 so clients on the host (and containers sharing this network
      # namespace) can reach it through the mapped port.
      FDB_NETWORKING_MODE: host
      FDB_PORT: "4500"
    ports:
      - "4500:4500"
