name: rift-dev

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: shop_dev
    ports:
      - "${RIFT_PG_PORT:-5432}:5432"
    volumes:
      - ./dev/seed:/seed:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "shop_dev"]
      interval: 2s
      timeout: 2s
      retries: 30

  redis:
    image: redis:7
    ports:
      - "${RIFT_REDIS_PORT:-6379}:6379"
    volumes:
      - ./dev/seed:/seed:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: mysql
      MYSQL_DATABASE: shop
    ports:
      - "${RIFT_MYSQL_PORT:-3306}:3306"
    volumes:
      - ./dev/seed:/seed:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-pmysql"]
      interval: 2s
      timeout: 2s
      retries: 60
