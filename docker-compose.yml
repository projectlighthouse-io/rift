name: rift-dev

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: shop_dev
    ports:
      - "${RIFT_PG_PORT:-5432}:5432"
    volumes:
      - ./dev/seed:/seed:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "shop_dev"]
      interval: 2s
      timeout: 2s
      retries: 30

  redis:
    image: redis:7
    ports:
      - "${RIFT_REDIS_PORT:-6379}:6379"
    volumes:
      - ./dev/seed:/seed:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30
